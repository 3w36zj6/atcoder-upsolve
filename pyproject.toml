[project]
name = "atcoder-upsolve"
version = "0.1.0"
dependencies = [
    "cpycppyy==1.13.0",
    "cython==3.1.3",
    "jinja2==3.1.6",
    "markupsafe==3.0.2",
    "pulp==3.2.2",
    "absl-py==2.3.1",
    "ac-library-python @ git+https://github.com/not522/ac-library-python@58f324ec020d57191e7b9e4957b0c5feb5ed3aff",
    "acl-cpp-python==0.6.2",
    "bitarray==3.6.1",
    "cppyy==3.5.0",
    "cppyy-backend==1.15.3",
    "cppyy-cling==6.32.8",
    "filelock==3.19.1",
    "fsspec==2025.7.0",
    "gmpy2==2.2.1",
    "immutabledict==4.2.1",
    "joblib==1.5.1",
    "lightgbm==4.6.0",
    "llvmlite==0.44.0",
    "more-itertools==10.7.0",
    "mpmath==1.3.0",
    "networkx==3.5",
    "numba==0.61.2",
    "numpy==2.2.6",
    "ortools==9.14.6206",
    "pandas==2.3.2",
    "polars==1.31.0",
    "protobuf==6.31.1",
    "pyrsistent==0.20.0",
    "python-dateutil==2.9.0.post0",
    "pytz==2025.2",
    "rustworkx==0.16.0",
    "scikit-learn==1.7.1",
    "scipy==1.16.1",
    "shapely==2.1.1",
    "six==1.17.0",
    "sortedcontainers==2.4.0",
    "sympy==1.14.0",
    "threadpoolctl==3.6.0",
    "torch==2.8.0+cpu",
    "typing_extensions==4.14.1",
    "tzdata==2025.2",
    "z3-solver==4.15.3.0",
]
requires-python = ">= 3.11"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 120
lint.select = ["ALL"]
lint.ignore = [
    "EXE",    # flake8-executable
    "T20",    # flake8-print
    "E501",   # line-too-long
    "D203",   # one-blank-line-before-class
    "D213",   # multi-line-summary-second-line
    "D100",   # undocumented-public-module
    "D415",   # ends-in-punctuation
    "INP001", # implicit-namespace-package
    "S101",   # assert
    "COM812", # missing-trailing-comma
    "ISC001", # single-line-implicit-string-concatenation
]
lint.pydocstyle.convention = "google"

[tool.mypy]
strict = true

[tool.pytest.ini_options]
pythonpath = "."
testpaths = ["tests"]

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src"]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cpu" }]
torchvision = [{ index = "pytorch-cpu" }]
